<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌍 Buscador Lugares Antamina 2026 </title>

<link rel="stylesheet" href="style.css">

<!-- Leaflet (sigue siendo necesario; MapTiler usa raster tiles de Leaflet) -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- Estilos de notificaciones (toasts/popups) -->
<link rel="stylesheet" href="notifications.css">

</head>

<body>

<div class="container">

    <h1>🌍 Buscador Lugares Mina </h1>

    <input
        id="search"
        type="text"
        placeholder="Buscar lugar..."
        autocomplete="off"
        autofocus>

    <div id="stats">
        Cargando lugares...
    </div>

    <div id="results">
    </div>

    <!-- NUEVO -->
    <div id="map-container">
        <div id="map"></div>
        <!-- Botón de ubicación actual (estilo Google Maps) -->
        <button id="btn-ubicacion" title="Mi ubicación" aria-label="Mostrar mi ubicación">
            <svg viewBox="0 0 24 24" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285f4" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/>
            </svg>
        </button>
    </div>
    <div id="info-panel">

    	<h2>Seleccione un lugar</h2>

    	<div id="info-content">

        	Utilice el buscador para localizar un lugar.

    	</div>

    </div>

</div>

<!-- Fuse.js -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase se carga como módulo ES dentro de js/notifications.js -->

<script type="module" src="js/app.js"></script>

</body>
</html>
