<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌍 Buscador Lugares Antamina 2026 </title>

<link rel="stylesheet" href="style.css">

<!-- Leaflet -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

</head>

<body>

<div class="container">

    <h1>🌍 Buscador Lugares Mina </h1>

    <input
        id="search"
        type="text"
        placeholder="Buscar lugar..."
        autocomplete="off"
        autofocus>

    <div id="stats">
        Cargando lugares...
    </div>

    <div id="results">
    </div>

    <!-- NUEVO -->
    <div id="map"></div>
    <div id="info-panel">

    	<h2>Seleccione un lugar</h2>

    	<div id="info-content">

        	Utilice el buscador para localizar un lugar.

    	</div>

    </div>

</div>


<!-- Fuse.js -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module" src="js/app.js"></script>

</body>
</html>
